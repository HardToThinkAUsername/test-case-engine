[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "test-case-engine"
version = "0.1.0"
description = "AI-powered test case generation from requirement documents."
requires-python = ">=3.12"

dependencies = [
  "typer>=0.12,<1.0",
  "openpyxl>=3.1,<4.0",
]

[project.scripts]
test-case-engine = "test_case_engine.cli:app"
